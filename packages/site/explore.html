<html lang="en">

      <footer class="footer"><a class="brand footer-brand" href="/" aria-label="SessionGraph home"><img src="/assets/brand/mark.svg" width="28" height="28" alt="">SessionGraph</a><p>Only what you choose to share.</p><div><a href="https://github.com/arvindell/sessiongraph">GitHub ↗</a><a href="https://github.com/arvindell/sessiongraph/blob/main/PRIVACY.md">Privacy</a></div></footer>
