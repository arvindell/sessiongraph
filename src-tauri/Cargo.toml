[package]
name = "sessiongraph"
version = "1.0.0"
description = "Explore & visualize all your LLM sessions"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
