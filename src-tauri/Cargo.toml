[package]
name = "sessiongraph"
version = "0.1.0"
description = "Search & visualize all your LLM sessions"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
